<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Style</title>
    <style>
     *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
    overflow:hidden;
    cursor:none;
}

/* -------------------- */
/* Navbar */
/* -------------------- */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 50px;
    background:#fff;
    z-index:1000;
}

.logo,
.menu{
    font-size:14px;
    letter-spacing:4px;
    font-weight:600;
}

/* -------------------- */
/* Hero */
/* -------------------- */

.hero{
    position: relative;
    width: 100%;
    height: calc(100vh - 70px);
    margin-top: 70px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
#heroText{
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    text-align: center;
    z-index: 1;
}

.word{
    display:block;
    overflow:hidden;
    font-size:11rem;
    font-weight:900;
    letter-spacing:-6px;
    line-height:.9;
    margin:5px 0;
}

.word span{
    display:inline-block;
    opacity:0;
    transform:translateY(120%);
    animation:letterReveal .7s cubic-bezier(.19,1,.22,1) forwards;
}

@keyframes letterReveal{
    from{
        opacity:0;
        transform:translateY(120%);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* -------------------- */
/* Floating Video */
/* -------------------- */

.container{
    position:absolute;
    width:250px;
    height:340px;
    overflow:hidden;
    border-radius:18px;
    pointer-events:none;
    z-index:10;
    box-shadow:0 25px 60px rgba(0,0,0,.35);
    transition:box-shadow .3s;
    /* opacity:0; */
    transition:opacity .3s;
}

.container video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* -------------------- */
/* Responsive */
/* -------------------- */

@media (max-width:1024px){

    .line{
        font-size:8rem;
    }

}

@media (max-width:768px){

    nav{
        padding:0 20px;
    }

    .line{
        font-size:5rem;
        letter-spacing:-2px;
    }

    .container{
        width:180px;
        height:250px;
    }

}

@media (max-width:480px){

    .line{
        font-size:3.5rem;
    }

    .logo,
    .menu{
        font-size:12px;
    }

    .container{
        width:150px;
        height:210px;
    }

}
    </style>
</head>
<body>

    <nav>
        <div class="logo">STUDIO NAMMA</div>
        <div class="menu">MENU</div>
    </nav>

   <section class="hero">

    <h1 id="heroText">
        <div class="word">WE THINK</div>
        <div class="word">CRAFT AND</div>
        <div class="word">DESIGN</div>
    </h1>

    <div class="container">
        <video autoplay loop muted playsinline>
            <source src="https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985%2F68dfa5030619737bde7460e5_Home-Hero-DK%20ModeV4-transcode.mp4">
        </video>
    </div>

</section>

    <script>

        const words = document.querySelectorAll(".word");

words.forEach((word, lineIndex) => {

    const text = word.textContent;
    word.innerHTML = "";

    [...text].forEach((letter, letterIndex) => {

        const span = document.createElement("span");

        if(letter === " "){
            span.innerHTML = "&nbsp;";
            span.classList.add("space");
        }else{
            span.textContent = letter;
        }

        span.style.animationDelay =
            `${lineIndex * 0.8 + letterIndex * 0.05}s`;

        word.appendChild(span);

    });

});
      const card = document.querySelector(".container");
const heroText = document.getElementById("heroText");
// const lines = document.querySelectorAll(".line");

// ------------------------------
// Mouse Follow Variables
// ------------------------------

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

let x = mouseX;
let y = mouseY;

let rotate = 0;
let targetRotate = 0;

let prevX = mouseX;
// let moving;

// Text movement
let textX = 0;
let textY = 0;

// ------------------------------
// Mouse Move
// ------------------------------

window.addEventListener("mousemove", (e) => {

    // Card Follow
    mouseX = e.clientX - 110;
    mouseY = e.clientY - 160;

    // Rotation based on speed
    let speed = e.clientX - prevX;
    targetRotate = Math.max(-15, Math.min(15, speed * 0.4));
    prevX = e.clientX;

    clearTimeout(moving);

    moving = setTimeout(() => {
        targetRotate = 0;
    }, 120);

    // --------------------------
    // Background Text Parallax
    // --------------------------

    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    textX = (e.clientX - centerX) * 0.015;
    textY = (e.clientY - centerY) * 0.015;
});

// ------------------------------
// Animation Loop
// ------------------------------

function animate() {

    // Smooth Card Follow
    x += (mouseX - x) * 0.12;
    y += (mouseY - y) * 0.12;

    rotate += (targetRotate - rotate) * 0.12;

    let scale = Math.abs(targetRotate) > 1 ? 1.08 : 1;

    card.style.left = x + "px";
    card.style.top = y + "px";

    card.style.transform =
        `translate(-50%,-50%) rotate(${rotate}deg) scale(${scale})`;

    // --------------------------
    // Smooth Hero Text Movement
    // --------------------------

    heroText.style.left = `calc(50% + ${textX}px)`;
    heroText.style.top = `calc(50% + ${textY}px)`;
   

    requestAnimationFrame(animate);
}

animate();
    </script>

</body>
</html>
