<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#efefef;
    color:#111;
    overflow:hidden;
    transition:.4s;
}

#cursor{
    width:20px;
    height:20px;
    background:#1625ff;
    border-radius:50%;
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:9999;
}

.hero{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.subtitle{
    font-family:'Space Mono', monospace;
    font-size:18px;
    letter-spacing:5px;
    margin-bottom:40px;
}

.hero-text{
    width:100%;
    text-align:center;
}

.line{
    font-family:'Anton', sans-serif;
    font-size:6.3vw;
    line-height:.92;
    text-transform:uppercase;
}

@media(max-width:900px){
.subtitle{
    font-size:12px;
    letter-spacing:2px;
}

.line{
    font-size:11vw;
}
}

.underline-hover-word{
    text-decoration:underline;
    text-decoration-thickness:3px;
    text-underline-offset:5px;
    line-height:1.2;
}

#floatingCard{
    position:fixed;
    width:320px;
    height:350px;
    pointer-events:none;
    opacity:0;
    transition:.3s;
    overflow:visible;
}

#floatingCard.show{
    opacity:1;
}

#floatingCard img{
    position:absolute;
    width:170px;
    height:220px;
    object-fit:cover;
    border-radius:12px;

    opacity:0;
    transform:scale(0);

    transition:
        transform .35s cubic-bezier(.19,1,.22,1),
        opacity .35s;
}

#floatingCard img:nth-child(1){
    left:0;
    top:0;
    z-index:3;
}

#floatingCard img:nth-child(2){
    left:20px;
    top:15px;
    z-index:2;
}

#floatingCard img:nth-child(3){
    left:40px;
    top:30px;
    z-index:1;
}
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Custom Cursor -->
    <div id="cursor"></div>

    <section class="hero">
        <p class="subtitle">
            CREATIVE STUDIO BUILDING PREMIUM BRANDS
        </p>

        <div class="hero-text">
            <div class="line">
                IT'S NEVER
                <span>"JUST A WEBSITE."</span>
            </div>

           <div class="line">
                EVERY
                <span class="underline-hover-word hover-word" id="detail">
                    DETAIL
                </span>
                MATTERS.
            </div>
            <div class="line">
                We craft digital experiences.
                Your design.Our obsession.
            </div>
            <div class="line">
                YOUR BRAND. OUR
                <span class="underline-hover-word hover-word" id="playground">
                    PLAYGROUND.
                </span>
            </div>
        </div>
    </section>

   <div id="floatingCard"></div>
   
    <script>

const cursor = document.getElementById("cursor");

document.addEventListener("mousemove", (e) => {

    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";

});

const card = document.getElementById("floatingCard");

const images = {
    detail: [
        "https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68d143844e199c5fe25893c6_Details%201.webp",
        "https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68d14384921ac39670293bad_Details2.webp",
        "https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68d14384e95f535d6ce77d4f_Details3.webp",
        "https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68d14384e6539b091e5c0c8b_Details4.webp",
        "https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68d14384b8a083b5d518278d_Details5.webp"
    ],

    playground: [
        "https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68d1446a3ce130a222671480_Playground3.webp",
        "https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68d1446a83ac058871c1ccfc_Playground2.webp",
        "https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68d1446a128c7643746e47f9_Playground1.webp",
        "https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68d1446a796dfc08d400d6ea_Playground4.webp",
        "https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68d1446a8736b633433d00f9_Playground5.webp"
    ]
};

let interval;
let currentIndex = 0;

// Move card with mouse
document.addEventListener("mousemove", (e) => {
    card.style.left = e.clientX -130  + "px";
    card.style.top = e.clientY - 130 + "px";
});

document.querySelectorAll(".hover-word").forEach(word => {

    word.addEventListener("mouseenter", () => {

        card.innerHTML = "";
        card.classList.add("show");

        currentIndex = 0;

        interval = setInterval(() => {

            const list = images[word.id];

            const img = document.createElement("img");
            img.src = list[currentIndex];

            // Random position
            img.style.left = Math.random() * 50 + "px";
            img.style.top = Math.random() * 50 + "px";

            // Pop animation
            img.style.transform = "scale(1.2)";
            img.style.opacity = "0";

            card.appendChild(img);

            requestAnimationFrame(() => {
                img.style.transform = "scale(1)";
                img.style.opacity = "1";
            });

            // Keep only last 5 images
            if (card.children.length > 5) {
                card.removeChild(card.firstElementChild);
            }

            currentIndex = (currentIndex + 1) % list.length;

        }, 250); // new image every 250ms

    });

    word.addEventListener("mouseleave", () => {

        clearInterval(interval);
        card.classList.remove("show");
        card.innerHTML = "";

    });

});
    </script>

</body>
</html>
