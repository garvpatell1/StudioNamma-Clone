<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Style Playground</title>

    <link rel="stylesheet" href="stylenamma.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Custom Cursor -->
    <div class="cursor"></div>

   
    <section class="hero">

        <p class="small-title">
            Selected Projects
        </p>

        <h1>
            PLAYGROUND
        </h1>

        <p class="subtitle">
        </p>

    </section>

    <!-- Projects -->
    <section class="projects">

        <!-- Card 1 -->
        <div class="card reveal">

            <div class="image">

                <img src="/matera.webp" alt="Project">

                <span class="tag">
                    WEB DESIGN
                </span>

            </div>

            <div class="content">

                <h2>
                    Matera
                </h2>

            </div>

        </div>

        <!-- Card 2 -->
        <div class="card reveal">

            <div class="image">

                <img src="/chance.webp" alt="Project">

                <span class="tag">
                    BRANDING
                </span>

            </div>

            <div class="content">

                <h2>
                    Chance
                </h2>

                <!-- <p>
                    Branding concept with clean typography and minimal aesthetics.
                </p> -->

            </div>

        </div>

    </section>

    <!-- View More -->
    <section class="more">

        <button id="viewBtn">
            VIEW MORE
        </button>

    </section>

    <!-- Footer -->
    <footer>

        <h2>
        </h2>

    </footer>

    <script>
// ==============================
// CUSTOM CURSOR
// ==============================

const cursor = document.querySelector(".cursor");

document.addEventListener("mousemove", (e) => {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
});

// ==============================
// SCROLL REVEAL
// ==============================

const cards = document.querySelectorAll(".card");

const observer = new IntersectionObserver((entries) => {

    entries.forEach((entry) => {

        if (entry.isIntersecting) {
            entry.target.classList.add("show");
        }

    });

}, {
    threshold: 0.2
});

cards.forEach((card) => {
    observer.observe(card);
});

// ==============================
// CARD TILT EFFECT
// ==============================

cards.forEach((card) => {

    card.addEventListener("mousemove", (e) => {

        const rect = card.getBoundingClientRect();

        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = -(y - centerY) / 25;
        const rotateY = (x - centerX) / 25;

        card.style.transform =
            `perspective(1000px)
             rotateX(${rotateX}deg)
             rotateY(${rotateY}deg)
             translateY(-12px)`;

    });

    card.addEventListener("mouseleave", () => {

        card.style.transform = "";

    });

});

// ==============================
// BUTTON CLICK
// ==============================

const button = document.getElementById("viewBtn");

button.addEventListener("click", () => {

    button.innerText = "COMING SOON";

    button.style.background = "#4a7dff";
    button.style.borderColor = "#4a7dff";

});

// ==============================
// HERO ANIMATION
// ==============================

const heading = document.querySelector(".hero h1");
const subtitle = document.querySelector(".subtitle");
const smallTitle = document.querySelector(".small-title");

heading.style.opacity = "0";
heading.style.transform = "translateY(80px)";

subtitle.style.opacity = "0";
subtitle.style.transform = "translateY(40px)";

smallTitle.style.opacity = "0";
smallTitle.style.transform = "translateY(40px)";

setTimeout(() => {

    heading.style.transition = "1s";
    heading.style.opacity = "1";
    heading.style.transform = "translateY(0)";

}, 200);

setTimeout(() => {

    subtitle.style.transition = "1s";
    subtitle.style.opacity = "1";
    subtitle.style.transform = "translateY(0)";

}, 500);

setTimeout(() => {

    smallTitle.style.transition = "1s";
    smallTitle.style.opacity = "1";
    smallTitle.style.transform = "translateY(0)";

}, 700);

// ==============================
// NAVBAR SHADOW ON SCROLL
// ==============================

const header = document.querySelector("header");

window.addEventListener("scroll", () => {

    if (window.scrollY > 50) {

        header.style.background = "rgba(10,10,10,0.95)";
        header.style.boxShadow = "0 5px 20px rgba(0,0,0,0.3)";

    } else {

        header.style.background = "rgba(15,15,15,.7)";
        header.style.boxShadow = "none";

    }

});
    </script>

</body>
</html>
